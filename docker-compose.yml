services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fashion_studio
      POSTGRES_USER: fashion_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashion_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fashion-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashion_user -d fashion_studio"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - fashion-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - fashion-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://fashion_user:${POSTGRES_PASSWORD:-fashion_pass}@postgres:5432/fashion_studio
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_BUCKET_NAME=fashion-studio
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-prod}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID}
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - fashion-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://fashion_user:${POSTGRES_PASSWORD:-fashion_pass}@postgres:5432/fashion_studio
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_BUCKET_NAME=fashion-studio
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-prod}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    networks:
      - fashion-network
    command: celery -A app.tasks.celery_app worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - fashion-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  fashion-network:
    driver: bridge
